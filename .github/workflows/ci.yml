name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest test/ -v || echo "No tests found, skipping"

      - name: Build artifact
        run: |
          mkdir -p dist
          cp -r src main.py requirements.txt dist/
          echo "${{ github.sha }}" > dist/VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-platform-build
          path: dist/
